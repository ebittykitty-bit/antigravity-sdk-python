edition = "2024";

package genai;

import "google/antigravity/proto/agents.proto";
import "google/antigravity/proto/content.proto";
import "google/antigravity/proto/elicitation.proto";
import "google/antigravity/proto/environment.proto";
import "google/antigravity/proto/hooks.proto";
import "google/antigravity/proto/interaction.proto";
import "google/antigravity/proto/models.proto";
import "google/antigravity/proto/sse_events.proto";
import "google/antigravity/proto/state_update.proto";
import "google/antigravity/proto/tools.proto";
import "google/antigravity/proto/genai_json_annotations.proto";

option features = { field_presence : IMPLICIT enum_type : OPEN utf8_validation : NONE };

enum InputDeliveryMode {
  INPUT_DELIVERY_MODE_UNSPECIFIED = 0;
  QUEUE = 1;
  IMMEDIATE = 2;
  SILENT = 3;
  BLOCKING = 4;
}
message ClientEventBatch {
  oneof connect_request {
    .genai.CreateInteractionEvent create_interaction = 7;
    .genai.ReconnectInteractionEvent reconnect_interaction = 8;
  }
  oneof end_request {
    .genai.CompleteInteractionEvent complete_interaction = 5;
    .genai.CancelInteractionEvent cancel_interaction = 6;
    .genai.DisconnectEvent disconnect = 9;
  }
  repeated .genai.ClientEvent events = 1;
  int64 ack_output_seq_num = 2;
}
message ClientEvent {
  oneof event_type {
    .genai.Payload payload = 3;
  }
  int64 seq_num = 10;
  int64 timestamp_micros = 11;
}
message ServerEventBatch {
  oneof connect_reply {
    .genai.InteractionCreatedEvent interaction_created = 7;
    .genai.InteractionReconnectedEvent interaction_reconnected = 8;
  }
  oneof end_signal {
    .genai.InteractionCompletedEvent interaction_completed = 6;
  }
  repeated .genai.ServerEvent events = 1;
  int64 ack_input_seq_num = 2;
}
message FunctionInvocation {
  string call_id = 1;
  string name = 2;
  .genai.Struct arguments = 3;
}
message FunctionResultEvent {
  string call_id = 1;
  string name = 2;
  bool is_error = 3;
  .genai.Value result = 4;
}
message ElicitationResultEvent {
  oneof result {
    .genai.ContentList user_input = 2;
    .genai.UserTimeout user_timeout = 3;
    .genai.ConfirmationResponse confirmation = 4;
    .genai.MultipleChoiceResponse multiple_choice = 5;
  }
  string elicitation_id = 1;
}
message SkillDeclaration {
  string name = 1;
  string description = 2;
}
message SlashCommandDeclaration {
  string name = 1;
  string description = 2;
}
message CapabilitiesUpdate {
  repeated .genai.SkillDeclaration available_skills = 1;
  repeated .genai.SkillDeclaration added_skills = 2;
  repeated string removed_skill_names = 3;
  repeated .genai.SlashCommandDeclaration available_slash_commands = 4;
}
message ServerEvent {
  oneof event_type {
    option (gaos.parsing.subtype_source) = true;

    .genai.Payload payload = 3;
  }
  int64 seq_num = 10;
  int64 timestamp_micros = 11;
  .genai.Interaction.Usage usage = 12;
}
message CreateInteractionEvent {
  oneof config {
    option (gaos.parsing.subtype_source) = true;

    .genai.ModelInteraction model_interaction = 3
        [(gaos.parsing.json_discriminator) = "model"];
    .genai.AgentInteraction agent_interaction = 4
        [(gaos.parsing.json_discriminator) = "agent"];
  }
  oneof environment {
    option (gaos.parsing.is_union) = true;

    string env_id = 8;
    .genai.EnvironmentConfig remote_environment = 9 [
      (gaos.parsing.json_discriminator_value) = "remote",
      (gaos.parsing.json_only_discriminator) = "type"
    ];
  }
  string interaction_id = 22;
  string system_instruction = 5;
  repeated .genai.Content developer_instructions = 20;
  .genai.AppendedDeveloperInstructions appended_developer_instructions = 21;
  string previous_interaction_id = 15;
  repeated .genai.Tool tools = 7;
  extensions 1000 to max;
}
message InteractionCreatedEvent {
  string interaction_id = 1;
  repeated .genai.SkillDeclaration available_skills = 2;
  repeated .genai.SlashCommandDeclaration available_slash_commands = 3;
}
message ReconnectInteractionEvent {
  string interaction_id = 1 [json_name = "id"];
  int64 next_output_seq_num = 2;
  bool background = 3;
}
message InteractionReconnectedEvent {
  int64 next_input_seq_num = 1;
}
message CompleteInteractionEvent {}
message CancelInteractionEvent {}
message DisconnectEvent {}
message InteractionCompletedEvent {
  reserved 1;
  string created = 2;
  string updated = 3;
  extensions 1000 to max;
}
message Payload {
  oneof event_type {
    option (gaos.parsing.subtype_source) = true;

    .genai.StepStart step_start = 1
        [(gaos.parsing.json_discriminator_value) = "step.start"];
    .genai.StepDelta step_delta = 2
        [(gaos.parsing.json_discriminator_value) = "step.delta"];
    .genai.StepStop step_stop = 3
        [(gaos.parsing.json_discriminator_value) = "step.stop"];
    .genai.InputEvent input = 207
        [(gaos.parsing.json_discriminator_value) = "input"];
    .genai.StateUpdate state_update = 13;
    .genai.Interaction.Usage usage_update = 30;
    .genai.FunctionInvocation function_invocation = 14;
    .genai.CallHookRequest call_hook_request = 15;
    .genai.CapabilitiesUpdate capabilities_update = 17;
    .genai.CallHookResponse call_hook_response = 16;
    .genai.FunctionResultEvent function_result = 18
        [(gaos.parsing.json_discriminator_value) = "function_result"];
    .genai.ElicitationResultEvent elicitation_result = 19
        [(gaos.parsing.json_discriminator_value) = "elicitation_result"];
  }
  string sub_interaction_id = 6;
}
message InputEvent {
  message SlashCommand {
    string name = 1;
  }
  repeated .genai.Content content = 1;
  .genai.InputEvent.SlashCommand slash_command = 5;
  .genai.InputDeliveryMode mode = 3;
}
