edition = "2024";

package genai;

option features = { field_presence : IMPLICIT enum_type : OPEN utf8_validation : NONE };

enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  STOP_REASON_MAX_MODEL_CALLS_EXCEEDED = 1;
  STOP_REASON_MAX_TOOL_CALLS_EXCEEDED = 2;
  STOP_REASON_MAX_INPUT_TOKENS_EXCEEDED = 3;
  STOP_REASON_MAX_OUTPUT_TOKENS_EXCEEDED = 4;
  STOP_REASON_MAX_TOTAL_TOKENS_EXCEEDED = 5;
  STOP_REASON_QUOTA_EXHAUSTED = 6;
}
message StateUpdate {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_RUNNING = 1;
    STATE_WAITING_FOR_TASKS = 2;
    STATE_FULLY_IDLE = 3;
    STATE_CANCELLED = 4;
    STATE_WAITING_FOR_SUBAGENTS = 5;
  }
  string parent_interaction_id = 7;
  .genai.StateUpdate.State state = 3;
  string error = 4;
  .genai.StopReason reason = 5;
}
